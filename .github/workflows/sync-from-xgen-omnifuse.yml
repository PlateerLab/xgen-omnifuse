name: Sync from xgen-omnifuse

# jinsoo96/js-omnifuse is a mirror of PlateerLab/xgen-omnifuse. This job runs only on the
# mirror and fast-forwards it from the origin. It pushes with the repository's own
# GITHUB_TOKEN, so no personal access token is stored anywhere and nothing expires.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-from-xgen-omnifuse
  cancel-in-progress: false

jobs:
  fast-forward-mirror:
    if: github.repository == 'jinsoo96/js-omnifuse'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the mirror
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward from the organization origin
        run: |
          git remote add origin-org https://github.com/PlateerLab/xgen-omnifuse.git
          git fetch --no-tags origin-org main
          git checkout main
          git merge --ff-only origin-org/main
          git push origin main

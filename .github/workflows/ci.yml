name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  package:
    needs: [test, pair]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*

  pair:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install independent producer and consumer
        run: |
          python -m venv /tmp/knowledge-producer
          python -m venv /tmp/knowledge-consumer
          /tmp/knowledge-producer/bin/pip install xgen-ontology==0.9.0
          /tmp/knowledge-consumer/bin/pip install .
      - name: Build, serialize, reload and search across isolated packages
        run: python tools/check_package_pair.py --producer /tmp/knowledge-producer/bin/python --consumer /tmp/knowledge-consumer/bin/python
